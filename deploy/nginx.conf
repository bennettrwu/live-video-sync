events {}

http {
  include mime.types;
  types {
    application/vnd.apple.mpegurl m3u8;
    video/mp2t ts;
  }
  sendfile on;

  server {
    listen 80;

    # Single-page app
    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }

    # HLS media, mounted read-only from the host
    location /media/ {
      alias /data/media/;
      add_header Cache-Control "public, max-age=3600";
    }

    # Sync server: HTTP and WebSocket. Pings every second keep the socket
    # busy, but a generous read timeout avoids dropping an idle tab anyway.
    location /api/ {
      proxy_pass http://sync-server:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }
  }
}
